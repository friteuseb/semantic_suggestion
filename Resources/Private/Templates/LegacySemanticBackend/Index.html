<html xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers" xmlns:core="http://typo3.org/ns/TYPO3/CMS/Core/ViewHelpers" xmlns:be="http://typo3.org/ns/TYPO3/CMS/Backend/ViewHelpers" data-namespace-typo3-fluid="true">

<f:layout name="Default" />

<f:section name="Content">
    <div class="container-fluid ss-module">
        <div class="row">
            <div class="col-12">
                <h1 class="mb-3"><f:translate key="LLL:EXT:semantic_suggestion/Resources/Private/Language/locallang_be.xlf:module.title" /></h1>
                <f:if condition="{currentAnalysis}">
                    <p class="ss-subtitle"><f:translate key="LLL:EXT:semantic_suggestion/Resources/Private/Language/locallang_be.xlf:module.subtitle" arguments="{0: currentAnalysis.title}" /></p>
                </f:if>

                <f:if condition="{errorMessage}">
                    <div class="alert alert-info">
                        <h4><core:icon identifier="actions-info" /> <f:translate key="LLL:EXT:semantic_suggestion/Resources/Private/Language/locallang_be.xlf:backend.error.no_analysis" /></h4>
                        <p>{errorMessage}</p>
                        <div class="mt-3">
                            <p><strong><f:translate key="LLL:EXT:semantic_suggestion/Resources/Private/Language/locallang_be.xlf:backend.config.required" /></strong></p>
                            <ol class="mb-3">
                                <li><f:translate key="LLL:EXT:semantic_suggestion/Resources/Private/Language/locallang_be.xlf:backend.config.step1" /></li>
                                <li><f:translate key="LLL:EXT:semantic_suggestion/Resources/Private/Language/locallang_be.xlf:backend.config.step2" /></li>
                                <li><f:translate key="LLL:EXT:semantic_suggestion/Resources/Private/Language/locallang_be.xlf:backend.config.step3" />
                                    <ul>
                                        <li><f:translate key="LLL:EXT:semantic_suggestion/Resources/Private/Language/locallang_be.xlf:backend.config.param.start_page" /></li>
                                        <li><f:translate key="LLL:EXT:semantic_suggestion/Resources/Private/Language/locallang_be.xlf:backend.config.param.threshold" /></li>
                                        <li><f:translate key="LLL:EXT:semantic_suggestion/Resources/Private/Language/locallang_be.xlf:backend.config.param.exclude" /></li>
                                    </ul>
                                </li>
                                <li><f:translate key="LLL:EXT:semantic_suggestion/Resources/Private/Language/locallang_be.xlf:backend.config.step4" /></li>
                                <li><f:translate key="LLL:EXT:semantic_suggestion/Resources/Private/Language/locallang_be.xlf:backend.config.step5" /></li>
                            </ol>
                            <div class="alert alert-warning">
                                <f:translate key="LLL:EXT:semantic_suggestion/Resources/Private/Language/locallang_be.xlf:backend.config.note" />
                            </div>
                        </div>
                    </div>
                </f:if>


                <f:variable name="analysisCount">{availableAnalyses -> f:count()}</f:variable>
                <f:if condition="{analysisCount} > 1">
                    <div class="card mb-4">
                        <div class="card-header">
                            <h3 class="card-title mb-0">
                                <core:icon identifier="actions-system-list-open" />
                                <f:translate key="LLL:EXT:semantic_suggestion/Resources/Private/Language/locallang_be.xlf:backend.analysis.selection" />
                            </h3>
                        </div>
                        <div class="card-body">
                            <form action="" method="get" class="row g-3">
                                <!-- Preserve existing module parameters -->
                                <input type="hidden" name="M" value="web_SemanticSuggestion" />
                                <f:if condition="{moduleToken}">
                                    <input type="hidden" name="moduleToken" value="{moduleToken}" />
                                </f:if>
                                <f:if condition="{token}">
                                    <input type="hidden" name="token" value="{token}" />
                                </f:if>
                                
                                <div class="col-md-10">
                                    <label for="rootPageId" class="form-label"><f:translate key="LLL:EXT:semantic_suggestion/Resources/Private/Language/locallang_be.xlf:backend.analysis.available" /></label>
                                    <select name="rootPageId" id="rootPageId" class="form-select" onchange="this.form.submit()">
                                        <f:for each="{availableAnalyses}" as="analysis">
                                            <option value="{analysis.root_page_id}" {f:if(condition: '{analysis.root_page_id} == {currentRootPageId}', then: 'selected')}>
                                                {analysis.title} | {analysis.page_count} <f:translate key="LLL:EXT:semantic_suggestion/Resources/Private/Language/locallang_be.xlf:backend.analysis.pages_analyzed" /> | {analysis.pair_count} <f:translate key="LLL:EXT:semantic_suggestion/Resources/Private/Language/locallang_be.xlf:backend.analysis.stored_pairs" /> | <f:translate key="LLL:EXT:semantic_suggestion/Resources/Private/Language/locallang_be.xlf:module.analysis.start_page" /> {analysis.root_page_id}
                                            </option>
                                        </f:for>
                                    </select>
                                    <div class="form-text"><f:translate key="LLL:EXT:semantic_suggestion/Resources/Private/Language/locallang_be.xlf:backend.analysis.help" /></div>
                                </div>
                                <div class="col-md-2 d-flex align-items-end">
                                    <f:link.action action="index" class="btn btn-primary">
                                        <core:icon identifier="actions-refresh" />
                                        <f:translate key="LLL:EXT:semantic_suggestion/Resources/Private/Language/locallang_be.xlf:backend.refresh" />
                                    </f:link.action>
                                </div>
                            </form>
                        </div>
                    </div>
                </div>
            </f:if>





                <f:if condition="{currentAnalysis}">
                    <f:render partial="Backend/Overview" arguments="{_all}" />
                </f:if>
            </div>
        </div>
    </div>
</f:section>

</html>
